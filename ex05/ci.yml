name: Spring Boot Gradle CI

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Gradle tests
        run: |
          chmod +x gradlew
          ./gradlew clean test
          ./gradlew bootJar

  docker-build:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/nguyenthiyen03032006/it211-ss18-04:latest