name: Java Spring Boot CI

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    name: Run Unit Tests and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cap quyen cho Gradle Wrapper
        run: chmod +x gradlew

      - name: Thuc thi JUnit Test với Gradle
        run: ./gradlew test

      - name: Dong goi tep JAR va Gradle
        run: ./gradlew bootJar

      - name: Luu tru thanh pham JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar